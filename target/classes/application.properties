spring.application.name=aluguelcarros_vrs1

spring.datasource.url=jdbc:mysql://localhost:3306/aluguelcarros
spring.datasource.username=root
spring.datasource.password=positivo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace = never

spring.web.locale-resolver=accept-header
spring.web.locale=pt_BR

api.security.token.secret=${JWT_SECRET:12345678}

logging.level.org.springframework.transaction=DEBUG

# Configuração de parâmetros padrão de paginação do Swagger
springdoc.api-docs.pageable.default-page-size=10
springdoc.api-docs.pageable.max-page-size=50
springdoc.api-docs.pageable.default-sort=nome
