spring.application.name=aluguelcarros_vrs1

spring.datasource.url=jdbc:h2:mem:aluguelcarros;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

api.security.token.secret=${JWT_SECRET:12345}
api.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

spring.web.locale-resolver=accept-header
spring.web.locale=pt_BR
server.error.include-stacktrace=never
logging.level.org.springframework.transaction=DEBUG